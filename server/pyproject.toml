[project]
name = "courtvision-server"
version = "0.1.0"
description = "CourtVision NBA Analytics Platform - Backend Server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "polars>=1.14.0",
    "tenacity>=9.0.0",
    "aiolimiter>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
ml = [
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "torch>=2.5.0",
    "scikit-learn>=1.6.0",
    "pulp>=2.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
