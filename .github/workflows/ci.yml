name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (lint + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: courtvision
          POSTGRES_PASSWORD: courtvision
          POSTGRES_DB: courtvision
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        working-directory: server
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        working-directory: server
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        working-directory: server
        env:
          CV_DATABASE_URL: postgresql+asyncpg://courtvision:courtvision@localhost:5432/courtvision
          CV_REDIS_URL: redis://localhost:6379/0
        run: pytest

  client:
    name: Client (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Lint
        working-directory: client
        run: npm run lint
      - name: Build
        working-directory: client
        run: npm run build
