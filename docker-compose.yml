name: courtvision-lakers
services:
  postgres:
    image: postgres:16-alpine
    container_name: courtvision-lakers-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: courtvision
      POSTGRES_PASSWORD: courtvision
      POSTGRES_DB: lakers
    volumes:
      - lakers-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtvision -d lakers"]
      interval: 3s
      timeout: 3s
      retries: 20
  server:
    profiles: [app]
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CV_DATABASE_URL: postgresql+psycopg://courtvision:courtvision@postgres:5432/lakers
      CV_DATA_DIR: /app/data
      CV_AUTO_REFRESH: "1"
    volumes:
      - lakers-raw:/app/data
    depends_on:
      postgres:
        condition: service_healthy
  client:
    profiles: [app]
    build:
      context: ./client
      args:
        CV_API_ORIGIN: http://server:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [server]
volumes:
  lakers-raw:
    name: courtvision_lakers_raw
  lakers-data:
    name: courtvision_lakers_data
